# Local Postgres for Open Intelligence: org, users, teams, memory (and later sessions).
#   docker compose up -d && npm run db:migrate
name: open-intelligence

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: glass
      POSTGRES_PASSWORD: glass
      POSTGRES_DB: glass
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glass -d glass"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
    name: open-glass_pgdata # keep the existing local data after the repo rename
