<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 30px; font-weight: 700; fill: #111827; }
    .accent { fill: #2F6BDF; }
    .h { font-size: 18px; font-weight: 700; }
    .t { font-size: 15px; fill: #6B7280; }
    .row { font-size: 16px; fill: #1F2937; }
    .foot { font-size: 16px; font-weight: 700; }
  </style>
  <rect width="1200" height="560" rx="16" fill="#FFFFFF"/>
  <text x="40" y="58" class="title"><tspan class="accent">An agent for every person</tspan> does the work first. You just decide.</text>

  <!-- today -->
  <rect x="40" y="96" width="545" height="430" rx="14" fill="#F3F4F6"/>
  <text x="70" y="138" class="h" fill="#111827">Today: head of ops, 60-person startup</text>
  <g>
    <text x="70" y="190" class="t">9:02</text><text x="140" y="190" class="row">Pastes a customer email into ChatGPT</text>
    <text x="70" y="240" class="t">9:06</text><text x="140" y="240" class="row">Searches Slack for the thread it refers to</text>
    <text x="70" y="290" class="t">9:11</text><text x="140" y="290" class="row">Digs up last week's meeting notes</text>
    <text x="70" y="340" class="t">9:15</text><text x="140" y="340" class="row">Works out who owns it</text>
    <text x="70" y="390" class="t">9:22</text><text x="140" y="390" class="row">Finds a time four people can meet</text>
    <text x="70" y="440" class="t">9:30</text><text x="140" y="440" class="row">Copies the draft back into Gmail</text>
  </g>
  <line x1="70" y1="470" x2="555" y2="470" stroke="#E5E7EB" stroke-width="2"/>
  <text x="70" y="502" class="foot" fill="#6B7280">29 minutes of chasing, 1 minute of judgment</text>

  <!-- with OI -->
  <rect x="615" y="96" width="545" height="430" rx="14" fill="#EAF1FD"/>
  <text x="645" y="138" class="h accent">With Open Intelligence: her agent did it first</text>
  <g>
    <text x="645" y="190" class="t">7:40</text><text x="715" y="190" class="row">Agent read the email overnight</text>
    <text x="645" y="240" class="t">7:41</text><text x="715" y="240" class="row">Pulled the thread, notes and account history</text>
    <text x="645" y="290" class="t">7:42</text><text x="715" y="290" class="row">Found the owner, Sam, and asked Sam's agent</text>
    <text x="645" y="340" class="t">7:44</text><text x="715" y="340" class="row">Held Thursday 2pm with the other agents</text>
    <text x="645" y="390" class="t">7:45</text><text x="715" y="390" class="row">Drafted the reply with sources</text>
    <rect x="635" y="414" width="505" height="40" rx="8" fill="#2F6BDF"/>
    <text x="645" y="440" class="t" fill="#FFFFFF" style="fill:#FFFFFF">9:02</text><text x="715" y="440" class="row" font-weight="700" style="fill:#FFFFFF">She approves it in one click</text>
  </g>
  <line x1="645" y1="470" x2="1130" y2="470" stroke="#C7D7F6" stroke-width="2"/>
  <text x="645" y="502" class="foot accent">1 minute, all of it judgment</text>
</svg>
